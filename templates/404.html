{% extends "base.html" %}

{% block title %}Page Not Found (404) - Expense Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-12 col-md-6">
        <div class="mb-4 text-warning">
            <i class="bi bi-compass fs-1" style="font-size: 4rem !important;"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark">404</h1>
        <h4 class="fw-semibold text-secondary mb-3">Page Not Found</h4>
        <p class="text-muted mb-4">
            The requested page does not exist or has been moved. Let's get you back on track.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('index') }}" class="btn btn-primary px-4 shadow-sm">
                <i class="bi bi-house-door-fill me-1"></i> Dashboard
            </a>
            <a href="{{ url_for('view') }}" class="btn btn-outline-secondary px-4">
                <i class="bi bi-table me-1"></i> View Expenses
            </a>
        </div>
    </div>
</div>
{% endblock %}
