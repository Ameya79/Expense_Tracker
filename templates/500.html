{% extends "base.html" %}

{% block title %}Server Error (500) - Expense Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-12 col-md-6">
        <div class="mb-4 text-danger">
            <i class="bi bi-exclamation-octagon fs-1" style="font-size: 4rem !important;"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark">500</h1>
        <h4 class="fw-semibold text-secondary mb-3">Internal Server Error</h4>
        <p class="text-muted mb-4">
            Something went wrong while processing your request. Please try again or return to the dashboard.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('index') }}" class="btn btn-primary px-4 shadow-sm">
                <i class="bi bi-house-door-fill me-1"></i> Dashboard
            </a>
            <a href="{{ url_for('view') }}" class="btn btn-outline-secondary px-4">
                <i class="bi bi-table me-1"></i> View Expenses
            </a>
        </div>
    </div>
</div>
{% endblock %}
