services:
  expense_tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense_tracker_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY:-expense_tracker_production_secret_key_change_me}
      - FLASK_ENV=production
    volumes:
      - expense_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  expense_data:
    driver: local
